name: Package FSL 6.0.7.23

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      - name: Download FSL environment
        run: |
          echo "======================================"
          echo "Downloading FSL 6.0.7.23 environment"
          echo "======================================"

          curl -fL \
            "https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/releases/fsl-6.0.7.23_linux-64.yml" \
            -o fsl-6.0.7.23_linux-64.yml

          echo ""
          ls -lh fsl-6.0.7.23_linux-64.yml


      - name: Install micromamba
        run: |
          echo "======================================"
          echo "Installing micromamba"
          echo "======================================"

          curl -Ls \
            "https://micro.mamba.pm/api/micromamba/linux-64/latest" \
            | tar -xvj bin/micromamba

          chmod +x bin/micromamba

          echo ""
          ./bin/micromamba --version


      - name: Create FSL environment
        env:
          MAMBA_ROOT_PREFIX: ${{ github.workspace }}/mamba-root
        run: |
          echo "======================================"
          echo "Creating FSL 6.0.7.23"
          echo "======================================"

          ./bin/micromamba create \
            --yes \
            --prefix "${GITHUB_WORKSPACE}/fsl" \
            --file fsl-6.0.7.23_linux-64.yml

          echo ""
          echo "FSL installation completed."


      - name: Verify FSL installation
        run: |
          echo "======================================"
          echo "Verifying FSL installation"
          echo "======================================"

          test -x "${GITHUB_WORKSPACE}/fsl/bin/fslmaths"
          test -x "${GITHUB_WORKSPACE}/fsl/bin/flirt"
          test -x "${GITHUB_WORKSPACE}/fsl/bin/fslstats"

          echo "fslmaths: OK"
          echo "flirt: OK"
          echo "fslstats: OK"

          echo ""
          echo "FSL size:"
          du -sh "${GITHUB_WORKSPACE}/fsl"


      - name: Create compressed archive
        run: |
          echo "======================================"
          echo "Creating compressed FSL archive"
          echo "======================================"

          tar \
            --zstd \
            -cf fsl-6.0.7.23-linux-64.tar.zst \
            -C "${GITHUB_WORKSPACE}" \
            fsl

          echo ""
          echo "Archive created:"
          ls -lh fsl-6.0.7.23-linux-64.tar.zst

          echo ""
          echo "Archive size:"
          du -h fsl-6.0.7.23-linux-64.tar.zst


      - name: Calculate archive checksum
        run: |
          echo "======================================"
          echo "Calculating SHA256"
          echo "======================================"

          sha256sum \
            fsl-6.0.7.23-linux-64.tar.zst \
            | tee fsl-6.0.7.23-linux-64.tar.zst.sha256

          echo ""
          cat fsl-6.0.7.23-linux-64.tar.zst.sha256


      - name: Test extracted archive
        run: |
          echo "======================================"
          echo "Testing archive extraction"
          echo "======================================"

          mkdir -p relocated-test

          tar \
            --zstd \
            -xf fsl-6.0.7.23-linux-64.tar.zst \
            -C relocated-test

          echo ""
          echo "Checking extracted FSL..."

          test -x relocated-test/fsl/bin/fslmaths
          test -x relocated-test/fsl/bin/flirt
          test -x relocated-test/fsl/bin/fslstats

          echo "fslmaths: OK"
          echo "flirt: OK"
          echo "fslstats: OK"

          echo ""
          echo "Testing extracted fslmaths:"
          relocated-test/fsl/bin/fslmaths -h | head -20

          echo ""
          echo "Testing extracted flirt:"
          relocated-test/fsl/bin/flirt -version

          echo ""
          echo "Testing extracted fslstats:"
          relocated-test/fsl/bin/fslstats -h | head -10

          echo ""
          echo "======================================"
          echo "RELOCATED ARCHIVE TEST PASSED"
          echo "======================================"


      - name: Split archive into parts
        run: |
          echo "======================================"
          echo "Splitting FSL archive"
          echo "======================================"

          mkdir -p fsl-parts

          split \
            -b 1500M \
            -d \
            -a 2 \
            fsl-6.0.7.23-linux-64.tar.zst \
            fsl-parts/fsl-6.0.7.23-linux-64.part-

          echo ""
          echo "Created parts:"
          ls -lh fsl-parts/


      - name: Calculate part checksums
        run: |
          echo "======================================"
          echo "Calculating SHA256 for parts"
          echo "======================================"

          cd fsl-parts

          sha256sum \
            fsl-6.0.7.23-linux-64.part-* \
            | tee SHA256SUMS.txt

          echo ""
          cat SHA256SUMS.txt


      - name: Verify archive reconstruction
        run: |
          echo "======================================"
          echo "Testing archive reconstruction"
          echo "======================================"

          cat \
            fsl-parts/fsl-6.0.7.23-linux-64.part-* \
            > reconstructed-fsl-6.0.7.23-linux-64.tar.zst

          echo ""
          echo "Comparing reconstructed archive with original..."

          cmp \
            fsl-6.0.7.23-linux-64.tar.zst \
            reconstructed-fsl-6.0.7.23-linux-64.tar.zst

          echo ""
          echo "Original SHA256:"
          sha256sum \
            fsl-6.0.7.23-linux-64.tar.zst

          echo ""
          echo "Reconstructed SHA256:"
          sha256sum \
            reconstructed-fsl-6.0.7.23-linux-64.tar.zst

          echo ""
          echo "======================================"
          echo "RECONSTRUCTION TEST PASSED"
          echo "======================================"


      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "Creating GitHub Release"
          echo "======================================"

          gh release create \
            "fsl-6.0.7.23" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FSL 6.0.7.23 Linux-64 Offline Package" \
            --notes "FSL 6.0.7.23 Linux-64 environment packaged for offline installation."

          echo ""
          echo "Release created."


      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "Uploading release assets"
          echo "======================================"

          gh release upload \
            "fsl-6.0.7.23" \
            fsl-parts/fsl-6.0.7.23-linux-64.part-00 \
            fsl-parts/fsl-6.0.7.23-linux-64.part-01 \
            fsl-parts/fsl-6.0.7.23-linux-64.part-02 \
            fsl-parts/fsl-6.0.7.23-linux-64.part-03 \
            fsl-parts/SHA256SUMS.txt \
            fsl-6.0.7.23-linux-64.tar.zst.sha256 \
            --repo "${GITHUB_REPOSITORY}"

          echo ""
          echo "All release assets uploaded successfully."


      - name: Show release information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "FSL RELEASE READY"
          echo "======================================"

          gh release view \
            "fsl-6.0.7.23" \
            --repo "${GITHUB_REPOSITORY}"

          echo ""
          echo "======================================"
          echo "DOWNLOAD PAGE"
          echo "======================================"

          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/fsl-6.0.7.23"
